
name: NasserNet Pro Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools'

      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --version
          sdkmanager --list_installed

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NASSERNET_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Keystore secret is missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/NasserNet-Pro-Release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "NASSERNET_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          NASSERNET_KEYSTORE_PASSWORD: ${{ secrets.NASSERNET_KEYSTORE_PASSWORD }}
          NASSERNET_KEY_ALIAS: ${{ secrets.NASSERNET_KEY_ALIAS }}
          NASSERNET_KEY_PASSWORD: ${{ secrets.NASSERNET_KEY_PASSWORD }}
        run: |
          if [ -z "$NASSERNET_KEYSTORE_PASSWORD" ] || \
             [ -z "$NASSERNET_KEY_ALIAS" ] || \
             [ -z "$NASSERNET_KEY_PASSWORD" ]; then
            echo "ERROR: Release signing secrets are incomplete."
            exit 1
          fi

          gradle --no-daemon clean testDebugUnitTest assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NasserNet-Pro-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
